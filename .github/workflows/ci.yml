name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TankerMade.sln

      - name: Build
        run: dotnet build TankerMade.sln --no-restore

      - name: Test
        run: dotnet test TankerMade.sln --no-build --verbosity normal
