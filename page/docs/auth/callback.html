<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in &mdash; TankerMade Dev</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--surface-page);
    }
    .callback-card {
      background: var(--surface-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      padding: 2.5rem 2rem; text-align: center; max-width: 360px; width: 90%;
    }
    .callback-card h2 {
      font-size: 1.1rem; font-weight: 600;
      margin: 1rem 0 0.5rem; color: var(--text-primary);
    }
    .callback-card p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
    .callback-card .spinner { margin: 0 auto; }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="spinner" role="status" aria-label="Authenticating"></div>
    <h2>Completing sign-in</h2>
    <p>Exchanging credentials with GitHub&hellip;</p>
  </div>

  <script>
    async function handleCallback() {
      var card = document.querySelector('.callback-card');

      try {
        var params = new URLSearchParams(window.location.search);
        var code   = params.get('code');
        var state  = params.get('state');
        var error  = params.get('error');

        if (error) throw new Error('GitHub declined: ' + error);
        if (!code)  throw new Error('No authorisation code received');

        var saved = localStorage.getItem('oauth-state');
        if (state !== saved) throw new Error('State mismatch \u2014 possible CSRF attempt');

        var res = await fetch('/api/oauth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });

        if (!res.ok) throw new Error('Token exchange failed (' + res.status + ')');

        var data = await res.json();
        localStorage.setItem('github-token', data.access_token);
        localStorage.removeItem('oauth-state');

        window.location.href = '/';

      } catch (err) {
        console.error('OAuth callback error:', err);
        card.replaceChildren();

        var icon = document.createElement('div');
        icon.style.cssText = 'font-size:2rem;margin-bottom:1rem;';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '\u274C';

        var title = document.createElement('h2');
        title.textContent = 'Sign-in failed';

        var message = document.createElement('p');
        message.textContent = err.message || 'An unexpected error occurred.';

        var redirect = document.createElement('p');
        redirect.style.cssText = 'margin-top:1rem;font-size:0.8rem;';
        redirect.textContent = 'Redirecting back...';

        card.append(icon, title, message, redirect);
        setTimeout(function () { window.location.href = '/'; }, 3500);
      }
    }

    handleCallback();
  </script>
</body>
</html>
